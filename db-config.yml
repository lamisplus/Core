spring:
    config:
        name: query
    datasource:
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: admin
        url: jdbc:postgresql://localhost:5432/chart_db
        hibernate:
            ddl-auto: none
            event.merge.entry_copy_observer: allow
        hikari:
            auto-commit: true
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
                useServerPrepStmts: true
            maximum-pool-size: 20
            minimum-idle: 5
    jpa:
        database: POSTGRESQL
        show-sql: true
        open-in-view: false
        properties:
            hibernate.enable_lazy_load_no_trans: true
lamis:
    temp-dir: runtime/
    module-path: modules

lamisplus:
    datasource:
        module:
            driver-class-name: org.postgresql.Driver
            username: postgres
            password: admin
            url: jdbc:postgresql://localhost:5432/chart_db
            hikari:
                    auto-commit: true
                    data-source-properties:
                        cachePrepStmts: true
                        prepStmtCacheSize: 250
                        prepStmtCacheSqlLimit: 2048
                        useServerPrepStmts: true
                    maximum-pool-size: 5
                    minimum-idle: 3
    base-url:
        version-one: "/api/v1/"
    secugen:
        biometrics:
            server-url: http://localhost:8282
            server-port: 8282
            timeout: 3000
            quality: 80
server:
    port: 9090



cache:
    names: core,module,server_sync,user   # The cache regions/names
    heap:
        size: 100                         # Heap size (number of entries)
    off-heap:
        size: 50                          # Off-heap storage size
        unit: MB                          # Unit is MB
    expiry:
        ttl:                              # Time-to-live (absolute expiration)
            minutes: 1
        idle:                             # Time-to-idle (inactive expiration)
            minutes: 1

    